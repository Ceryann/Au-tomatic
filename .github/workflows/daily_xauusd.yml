name: Au-tomatic Daily

on:
  schedule:
    # 22:30 UTC Sun-Thu = 05:30 WIB Mon-Fri. Always after the 17:00 New York
    # close (21:00 UTC in US summer, 22:00 UTC in US winter). Sunday run covers
    # the Monday candle.
    - cron: "30 22 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (checks the pipeline end to end, sends no email, prints no price levels)"
        type: boolean
        default: true

permissions:
  contents: write       # needed to commit the forecast ledger (data/predictions_log.csv)

concurrency:
  group: xauusd-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Au-tomatic
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Commit ledger
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/predictions_log.csv ]; then git add data/predictions_log.csv; fi
          if git diff --cached --quiet; then
            echo "No ledger changes."
          else
            git commit -m "ledger: $(date -u +%F)"
            git pull --rebase
            git push
          fi
