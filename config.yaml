# Au-tomatic - configuration
# Locked decision: D1 candle boundary = 17:00 America/New_York
# (matches the MT5 broker D1 open of the project owner).

market:
  twelvedata_symbol: "XAU/USD"   # TRUE spot gold (primary source)
  yahoo_symbols: ["GC=F"]        # Futures fallback only (Yahoo spot XAUUSD=X no longer exists)
  candle_cutoff_tz: "America/New_York"
  candle_cutoff_hour: 17         # D1 candle opens/closes at 17:00 NY

twelvedata:
  api_key_env: "TWELVEDATA_API_KEY"   # read from environment / GitHub Secret
  page_size: 5000                     # max bars per request on the free plan
  max_pages: 4                        # 4 pages ~ 20,000 hourly bars (~2.8 years)
  min_interval_seconds: 1             # pause between pages (limit: 8 requests/min)

data:
  history_days: 725              # stop paging once this much history is loaded
  min_sessions: 400              # minimum complete D1 candles required
  min_bars_per_session: 12       # hourly bars; gold normally has ~23
  max_stale_hours: 4             # newest hourly bar must be this fresh
  max_abs_daily_return: 0.08     # |close/close-1| above this = warning
  max_missing_weekdays: 15       # holidays tolerated before warning
  # --- US-holiday-aware validation (Task A1). Checked against real Twelve Data history with
  # tools/probe_holidays.py on 2026-11-25 (726 sessions, 2024-02 to 2026-11):
  #   * the thinnest US-holiday session that still had bars was 18 (Good Friday 2025), so
  #     holiday_min_bars below is a deliberately lenient floor, not a measured value;
  #   * 25 Dec, 1 Jan and Good Friday had NO bars in 2024 but 24 bars in 2025-2026, so absent_ok
  #     only TOLERATES an empty session; it does not force a "market closed" email. If the feed
  #     returns bars, the normal forecast is sent with the thin-liquidity note (decision of 2026-11-25).
  # Entries dated 2027-11 and later come from calendar rules and have not been seen in the feed yet.
  # Keys are session labels = the New York date on which the D1 candle CLOSES (17:00 NY).
  # Quote the dates so YAML keeps them as text.
  holiday_min_bars: 6            # hourly bars needed on a listed holiday session (normal: min_bars_per_session)
  holidays:
    "2026-11-26": {name: "Thanksgiving (US)"}
    "2026-12-24": {name: "Christmas Eve (US, early close)"}
    "2026-12-25": {name: "Christmas Day", absent_ok: true}    # absent_ok: session may be missing/near-empty
    "2026-12-31": {name: "New Year's Eve"}
    "2027-01-01": {name: "New Year's Day", absent_ok: true}
    "2027-03-26": {name: "Good Friday", absent_ok: true}
    "2027-11-25": {name: "Thanksgiving (US)"}
    "2027-12-24": {name: "Christmas Day (observed, US)", absent_ok: true}   # 25 Dec 2027 is a Saturday
    "2027-12-31": {name: "New Year's Eve"}
  retries: 4
  backoff_seconds: 5             # exponential: 5, 10, 20, ...

model:
  n_paths: 10000                 # Monte Carlo paths
  quantiles: [0.15, 0.50, 0.85]  # reported interval = P15-P85 (70% prediction interval)
  hmm:
    n_inits: 6                   # random restarts; best log-likelihood wins
    n_iter: 150
    min_history: 250             # minimum daily observations to fit the HMM
    seed: 7
  vol:
    ewma_lambda: 0.94            # RiskMetrics decay
    w_regime: 0.5                # weight of HMM regime vol vs EWMA vol
    floor_mult: 0.5              # sigma_D clipped to [floor, cap] x 60-day realised vol
    cap_mult: 2.0
  drift:
    k_regime: 0.5                # shrinkage on HMM regime mean
    k_kalman: 0.5                # shrinkage on Kalman velocity
    cap_sigma_mult: 0.2          # |mu_D| <= 0.2 x sigma_D
  jumps:
    mad_threshold: 2.5           # jump day: |r - median| > 2.5 x robust sigma
    lambda_min: 0.02
    lambda_max: 0.15
    lambda_cap: 0.50             # absolute ceiling after multipliers
    event_extra_var: 0.5         # extra variance on a high-impact event day, as a share of daily variance
                                 # (0.5 = the day is ~1.5x as variable). Calibrate: python tools/event_study.py
    max_scheduled_events: 2      # at most this many events add variance on one day
    sunday_mult: 1.5             # weekend-gap risk on Sunday runs
  bias:
    bull_above: 0.56             # P(close > open) >= 56% -> Bullish
    bear_below: 0.44             # <= 44% -> Bearish, otherwise Netral
  macro:
    enabled: true                # DXY / US10Y as extra HMM features (optional)
    symbols:
      dxy: "DX-Y.NYB"
      tnx: "^TNX"
    min_coverage: 0.95

news:
  enabled: true
  timeout_seconds: 10
  event_currency: "USD"
  lambda_impacts: ["High"]            # these raise the jump intensity
  display_impacts: ["High", "Medium"] # these are listed in the email
  calendar_urls:
    - "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
    - "https://nfs.faireconomy.media/ff_calendar_nextweek.json"
  # Fallback when the calendar feed is down: FOMC decision days (Federal Reserve calendar).
  # 2027 dates are tentative until confirmed by the Fed.
  static_events:
    - {date: "2026-12-09", time_ny: "14:00", title: "FOMC rate decision", impact: "High"}
    - {date: "2027-01-27", time_ny: "14:00", title: "FOMC rate decision", impact: "High"}
    - {date: "2027-03-17", time_ny: "14:00", title: "FOMC rate decision", impact: "High"}
    - {date: "2027-04-28", time_ny: "14:00", title: "FOMC rate decision", impact: "High"}
    - {date: "2027-06-09", time_ny: "14:00", title: "FOMC rate decision", impact: "High"}
    - {date: "2027-07-28", time_ny: "14:00", title: "FOMC rate decision", impact: "High"}
    - {date: "2027-09-15", time_ny: "14:00", title: "FOMC rate decision", impact: "High"}
    - {date: "2027-10-27", time_ny: "14:00", title: "FOMC rate decision", impact: "High"}
    - {date: "2027-12-08", time_ny: "14:00", title: "FOMC rate decision", impact: "High"}
  # Check these with: python tools/probe_news.py  (feeds change; any failing feed is skipped).
  # FXStreet's RSS refused connections from the owner's network, so Google News queries are used instead.
  rss_urls:
    - "https://news.google.com/rss/search?q=gold+price+OR+XAUUSD+OR+%22spot+gold%22+when:1d&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=gold+%28Fed+OR+dollar+OR+yields+OR+inflation+OR+payrolls%29+when:1d&hl=en-US&gl=US&ceid=US:en"
    - "https://news.google.com/rss/search?q=gold+%28%22safe+haven%22+OR+geopolitical+OR+%22central+bank%22+OR+tensions%29+when:1d&hl=en-US&gl=US&ceid=US:en"
  max_age_hours: 36
  extreme_score: 0.45                 # |aggregate score| at or above this shows headlines
  max_headlines: 3

ledger:
  path: "data/predictions_log.csv"   # relative forecasts + hit flags only (no prices)
  window: 30                         # sessions used for the live accuracy line
  min_n: 10                          # show the percentage only after this many settled sessions

email:
  subject_prefix: "[XAUUSD D1]"
  smtp_host: "smtp.gmail.com"
  smtp_port: 465
  display_tz: "Asia/Jakarta"     # WIB, for times shown in the email
  late_run_hours: 2.0            # run this many hours after the candle opened (GitHub can delay cron):
                                 # the email then carries a "Run terlambat" banner
  hide_recipients: true          # recipients cannot see each other (Bcc-style)
  retries: 3                     # SMTP attempts on transient errors (disconnects, timeouts)
  retry_delay_s: 5               # pause before retry n is retry_delay_s * 3^(n-1)
  fallback_starttls_587: true    # after SSL/465 fails, try STARTTLS on port 587
